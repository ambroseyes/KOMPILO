[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kompilo-backend"
version = "0.1.0"
description = "Kompilo — AI Execution Intelligence backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<1.0",
  "uvicorn[standard]>=0.54,<1.0",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "asyncpg>=0.31,<0.32",
  "alembic>=1.20,<2",
  "arq>=0.28,<0.29",
  "redis>=5.3,<6",
  "pgvector>=0.3,<1.0",
  "pyjwt>=2.15,<3",
  "bcrypt>=4.1,<6",
]

[project.optional-dependencies]
# Dev tools are pinned so the quality gates are reproducible between local and CI.
# ruff = linter, black = formatter (do NOT also enable ruff format — two
# formatters conflict).
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "httpx>=0.28,<0.29",
  "ruff==0.16.10",
  "black==26.5.1",
  "mypy==2.4.0",
  "pre-commit>=4.6,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
# Linting only — formatting is delegated to black.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
