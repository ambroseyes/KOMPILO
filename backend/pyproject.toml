[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kompilo-backend"
version = "0.1.0"
description = "Kompilo — AI Execution Intelligence backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.35,<2.1",
  "asyncpg>=0.29,<0.31",
  "alembic>=1.13,<1.14",
  "arq>=0.26,<0.27",
  "redis>=5.0,<6",
  "pgvector>=0.3,<0.4",
  "pyjwt>=2.9,<3",
  "passlib[bcrypt]>=1.7.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "httpx>=0.27,<0.28",
  "ruff>=0.6,<0.8",
  "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
