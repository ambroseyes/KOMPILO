# ─────────────────────────────────────────────────────────────────────────────
# Kompilo — Model Capability Registry
#
# The router reads these capabilities as DATA; it never hardcodes per-model logic.
# `last_verified` is MANDATORY. The cost (USD per 1M tokens), context_window and
# latency figures are public approximations as of that date and MUST be re-verified
# periodically — edit this file, do not touch the routing code.
# reasoning_strength ∈ {basic, medium, advanced, frontier}.
# ─────────────────────────────────────────────────────────────────────────────
models:
  - model: gpt-4o-mini
    provider: openai
    context_window: 128000
    supports_tools: true
    supports_vision: true
    structured_output: true
    reasoning_strength: medium
    cost_in: 0.15
    cost_out: 0.60
    latency_ms: 400
