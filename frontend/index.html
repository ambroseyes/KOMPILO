<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>KOMPILO — Intention → Exécution</title>
    <!-- Applique le thème enregistré avant le paint (évite le flash). Clair par défaut. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("kompilo-theme");
          var theme = t === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", theme === "dark" ? "#0A1628" : "#FFFFFF");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
